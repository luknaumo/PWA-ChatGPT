name: Build HM Krakow Android widget APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'HM_Krakow_Android_Widget.zip'
      - '.github/workflows/build-widget-from-zip.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack widget project
        run: |
          rm -rf _widget_build
          mkdir _widget_build
          unzip -q HM_Krakow_Android_Widget.zip -d _widget_build
          echo "Project structure:"
          find _widget_build -maxdepth 3 -type f | sort | head -100

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "Using sdkmanager: $SDK
