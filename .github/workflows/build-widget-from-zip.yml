name: Build HM Krakow Android widget APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'HM_Krakow_Android_Widget.zip'
      - '.github/workflows/build-widget-from-zip.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack widget project
        run: |
          rm -rf _widget_build
          mkdir _widget_build
          unzip -q HM_Krakow_Android_Widget.zip -d _widget_build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: _widget_build/android-widget
        run: gradle assembleDebug

      - name: Rename APK
        run: cp _widget_build/android-widget/app/build/outputs/apk/debug/app-debug.apk HM-Krakow-Widget.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HM-Krakow-Widget-APK
          path: HM-Krakow-Widget.apk
          if-no-files-found: error
