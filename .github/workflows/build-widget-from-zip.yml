name: Build Road to Berlin Android widget APK

permissions:
  contents: write

concurrency:
  group: road-to-berlin-widget-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'HM_Krakow_Android_Widget.zip'
      - '.github/workflows/build-widget-from-zip.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      WIDGET_KEYSTORE_PATH: /home/runner/.android/road-to-berlin-widget.keystore

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack widget project
        run: |
          rm -rf _widget_build
          mkdir _widget_build
          unzip -q HM_Krakow_Android_Widget.zip -d _widget_build
          echo "Project structure:"
          find _widget_build -maxdepth 3 -type f | sort | head -100

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore the widget signing key
        id: signing-key
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WIDGET_KEYSTORE_PATH }}
          key: road-to-berlin-widget-debug-signing-v2

      - name: Prepare the widget signing key
        shell: bash
        run: |
          mkdir -p "$(dirname "$WIDGET_KEYSTORE_PATH")"
          if [ ! -f "$WIDGET_KEYSTORE_PATH" ]; then
            keytool -genkeypair -keystore "$WIDGET_KEYSTORE_PATH" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore "$WIDGET_KEYSTORE_PATH" -storepass android \
            -alias androiddebugkey > /dev/null

      - name: Save the widget signing key
        if: steps.signing-key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WIDGET_KEYSTORE_PATH }}
          key: road-to-berlin-widget-debug-signing-v2

      - name: Install Android SDK packages
        shell: bash
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --version
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test and build APK
        working-directory: _widget_build/android-widget
        run: gradle --stacktrace testDebugUnitTest assembleDebug

      - name: Rename APK
        run: cp _widget_build/android-widget/app/build/outputs/apk/debug/app-debug.apk Road-to-Berlin-Widget-3x2.apk

      - name: Verify the installer
        shell: bash
        run: |
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose Road-to-Berlin-Widget-3x2.apk
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging Road-to-Berlin-Widget-3x2.apk
          python - <<'PY'
          import os, pathlib, re, subprocess
          signer = os.path.join(os.environ['ANDROID_HOME'], 'build-tools/35.0.0/apksigner')
          def certificate(path):
              output = subprocess.check_output([signer, 'verify', '--print-certs', str(path)], text=True)
              match = re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)', output)
              if not match:
                  raise RuntimeError('Missing signing certificate')
              return match.group(1).lower()
          previous = pathlib.Path('downloads/Road-to-Berlin-Widget-3x2.apk')
          if previous.exists():
              assert certificate(previous) == certificate('Road-to-Berlin-Widget-3x2.apk'), 'Signing key changed; installer cannot update the previous widget'
              print('Signing certificate matches the previous widget installer')
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Road-to-Berlin-Widget-APK
          path: Road-to-Berlin-Widget-3x2.apk
          if-no-files-found: error

      - name: Publish the installer
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const apk = fs.readFileSync('Road-to-Berlin-Widget-3x2.apk');
            const path = 'downloads/Road-to-Berlin-Widget-3x2.apk';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({ ...context.repo, path, ref: 'main' });
              sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo, path, branch: 'main', sha,
              message: 'Publish tested Road to Berlin widget installer',
              content: apk.toString('base64')
            });
            core.summary.addHeading('Road to Berlin widget');
            core.summary.addLink('Download APK', 'https://github.com/luknaumo/PWA-ChatGPT/raw/refs/heads/main/downloads/Road-to-Berlin-Widget-3x2.apk');
            core.summary.addRaw('\nInstaller for the resizable 3 by 2 widget. If the older widget is installed, uninstall only the widget add-on before installing this APK. Training completion stays in the PWA.\n');
            core.summary.addRaw('\nSHA-256: ' + crypto.createHash('sha256').update(apk).digest('hex'));
            await core.summary.write();

