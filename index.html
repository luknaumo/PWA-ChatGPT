<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Road to Berlin" />
  <title>Road to Berlin</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <style>
    :root{
      color-scheme: dark;
      --bg:#0b1020; --card:#121a2c; --soft:#1b2540; --text:#f5f7fb;
      --muted:#aeb8cc; --accent:#55d38a; --accent2:#7ea8ff; --warn:#ffd166;
      --border:#26324f;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:760px;margin:0 auto;padding:18px 14px 40px}
    .top{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px}
    .k{font-size:12px;color:var(--muted);margin-bottom:4px}
    .v{font-size:24px;font-weight:750;line-height:1.05}
    .s{font-size:13px;color:var(--muted);margin-top:4px}
    h1{font-size:20px;margin:6px 0 4px}
    h2{font-size:18px;margin:6px 0 4px}
    .goal{font-size:20px;line-height:1.2}
    .sub{color:var(--muted);font-size:14px;margin-bottom:14px}
    .day{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);
      border-radius:16px;padding:0;margin:10px 0;color:var(--text);overflow:hidden}
    .row{display:flex;gap:12px;align-items:center;padding:14px}
    .date{width:58px;flex:none}
    .dow{font-weight:700}
    .dm{font-size:12px;color:var(--muted)}
    .mid{min-width:0;flex:1}
    .title{font-weight:700}
    .meta{font-size:13px;color:var(--muted);margin-top:3px}
    .tag{font-size:12px;font-weight:700;padding:6px 8px;border-radius:999px;background:var(--soft);white-space:nowrap}
    .done{color:#b8f3cf}
    .details{display:none;padding:0 14px 14px 84px;color:#dce3f2;font-size:14px;line-height:1.5}
    .day.open .details{display:block}
    .day.today{outline:2px solid var(--accent2)}
    .day.completed{border-color:#2e7b53}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    button.small{border:1px solid var(--border);background:var(--soft);color:var(--text);border-radius:10px;padding:8px 10px;font-weight:650}
    .install{width:100%;border:0;background:var(--accent);color:#08120d;border-radius:14px;padding:13px 14px;font-weight:800;margin:14px 0 8px;display:none}
    .note{background:var(--soft);border:1px solid var(--border);border-radius:16px;padding:14px;margin-top:16px;font-size:14px;line-height:1.5}
    .footer{color:var(--muted);font-size:12px;margin-top:16px;text-align:center}
    .plan-status{color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:8px}
    button.small:disabled{opacity:.6}
    @media(max-width:520px){
      .top{grid-template-columns:1fr 1fr}
      .top .card:last-child{grid-column:1/-1}
      .details{padding-left:14px}
      .tag{font-size:11px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1 id="appName">Road to Berlin</h1>
    <div class="sub">Droga do półmaratonu w Berlinie</div>
    <div class="top">
      <section class="card"><div class="k">Cel</div><div class="v goal" id="goalName">Berlin Half Marathon</div><div class="s" id="goalLocation">Berlin</div></section>
      <section class="card"><div class="k">Start</div><div class="v" id="goalDate">04.04.2027</div><div class="s">Data zawodów</div></section>
      <section class="card"><div class="k">Postęp tygodnia</div><div class="v" id="progress">—</div><div class="s">dni oznaczonych jako wykonane</div></section>
    </div>

    <h2 id="weekTitle">Plan tygodniowy</h2>
    <div class="sub" id="weekDates"></div>
    <div class="plan-status" id="planStatus" role="status" aria-live="polite">Wczytywanie planu…</div>
    <button class="small" id="refreshBtn" type="button">Odśwież plan</button>

    <button id="installBtn" class="install">Dodaj na ekran główny</button>

    <section id="days" aria-label="Treningi w tym tygodniu" aria-busy="true"></section>

    <div class="note" id="weekNote" hidden>
      <strong>Zasada na ten tydzień:</strong> <span id="noteText"></span>
    </div>

    <div class="footer" id="storageStatus" role="status">Status wykonania zapisuje się lokalnie w telefonie.</div>
  </main>

<script>
const DONE_KEY = "hmDone";
const container = document.getElementById("days");
const planStatus = document.getElementById("planStatus");
const refreshBtn = document.getElementById("refreshBtn");
const storageStatus = document.getElementById("storageStatus");
let plan;
let loading = false;
let stored = {};

try {
  const saved = JSON.parse(localStorage.getItem(DONE_KEY) || "{}");
  if (!saved || typeof saved !== "object" || Array.isArray(saved)) throw new Error("Niepoprawny zapis");
  stored = saved;
} catch {
  storageStatus.textContent = "Nie udało się odczytać lokalnych oznaczeń. Możesz spróbować zapisać je ponownie.";
}

function localDate(date = new Date()) {
  return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, "0"), String(date.getDate()).padStart(2, "0")].join("-");
}

function isDate(value) {
  return typeof value === "string" && /^\d{4}-\d{2}-\d{2}$/.test(value) &&
    Number.isFinite(Date.parse(value)) && new Date(value).toISOString().slice(0, 10) === value;
}

function validatePlan(data) {
  const text = value => typeof value === "string" && value.trim().length > 0;
  if (!data || !text(data.appName) || !data.goal || !text(data.goal.name) ||
      !text(data.goal.location) || !isDate(data.goal.date) || !data.week ||
      !isDate(data.week.start) || !isDate(data.week.end) || !text(data.week.title) ||
      !text(data.week.note) || !Array.isArray(data.days) || data.days.length !== 7 ||
      Date.parse(data.week.end) - Date.parse(data.week.start) !== 6 * 86400000) {
    throw new Error("Niepoprawny format planu");
  }
  data.days.forEach((day, index) => {
    if (!day || !isDate(day.d) || Date.parse(day.d) !== Date.parse(data.week.start) + index * 86400000 ||
        ![day.title, day.meta, day.tag, day.details].every(text) ||
        (day.done !== undefined && typeof day.done !== "boolean")) {
      throw new Error("Niepoprawny dzień planu");
    }
  });
  return data;
}

function isDone(day) {
  return typeof stored[day.d] === "boolean" ? stored[day.d] : day.done === true;
}

function updateProgress() {
  document.getElementById("progress").textContent = `${plan.days.filter(isDone).length} / ${plan.days.length}`;
}

function renderPlan() {
  const openDays = new Set(Array.from(container.querySelectorAll(".day.open"), day => day.dataset.date));
  const today = localDate();
  const dateFormat = new Intl.DateTimeFormat("pl-PL", {dateStyle: "long", timeZone: "UTC"});
  const shortDate = value => value.split("-").reverse().join(".");
  document.title = plan.appName;
  document.getElementById("appName").textContent = plan.appName;
  document.getElementById("goalName").textContent = plan.goal.name;
  document.getElementById("goalLocation").textContent = plan.goal.location;
  document.getElementById("goalDate").textContent = shortDate(plan.goal.date);
  document.getElementById("weekTitle").textContent = plan.week.title;
  document.getElementById("weekDates").textContent = `${dateFormat.format(new Date(plan.week.start))} – ${dateFormat.format(new Date(plan.week.end))} · kliknij trening, żeby rozwinąć szczegóły`;
  document.getElementById("noteText").textContent = plan.week.note;
  document.getElementById("weekNote").hidden = false;
  container.replaceChildren();

  plan.days.forEach(day => {
    const el = document.createElement("article");
    el.dataset.date = day.d;
    el.className = "day" + (day.d === today ? " today" : "") + (openDays.has(day.d) ? " open" : "");
    el.innerHTML = `
      <div class="row" role="button" tabindex="0" aria-expanded="false">
        <div class="date"><div class="dow"></div><div class="dm"></div></div>
        <div class="mid"><div class="title"></div><div class="meta"></div></div>
        <div class="tag"></div>
      </div>
      <div class="details">
        <div class="description"></div>
        <div class="actions"><button class="small doneBtn" type="button"></button></div>
      </div>`;
    const row = el.querySelector(".row");
    const details = el.querySelector(".details");
    details.id = `details-${day.d}`;
    row.setAttribute("aria-controls", details.id);
    row.setAttribute("aria-expanded", String(openDays.has(day.d)));
    el.querySelector(".dow").textContent = ["Nd", "Pon", "Wt", "Śr", "Czw", "Pt", "Sob"][new Date(day.d).getUTCDay()];
    el.querySelector(".dm").textContent = shortDate(day.d).slice(0, 5);
    el.querySelector(".meta").textContent = day.meta;
    el.querySelector(".description").textContent = day.details;
    const doneBtn = el.querySelector(".doneBtn");
    const updateDone = () => {
      const done = isDone(day);
      el.classList.toggle("completed", done);
      el.querySelector(".title").textContent = day.title + (done ? " ✓" : "");
      const tag = el.querySelector(".tag");
      tag.textContent = done ? "Wykonany" : day.tag;
      tag.classList.toggle("done", done);
      doneBtn.textContent = done ? "Cofnij wykonanie" : "Oznacz jako wykonany";
      doneBtn.setAttribute("aria-pressed", String(done));
      updateProgress();
    };
    const toggle = () => row.setAttribute("aria-expanded", String(el.classList.toggle("open")));
    row.addEventListener("click", toggle);
    row.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); toggle(); }
    });
    doneBtn.addEventListener("click", () => {
      const updated = {...stored, [day.d]: !isDone(day)};
      try {
        localStorage.setItem(DONE_KEY, JSON.stringify(updated));
        stored = updated;
        storageStatus.textContent = "Status wykonania zapisuje się lokalnie w telefonie.";
        updateDone();
      } catch {
        storageStatus.textContent = "Nie udało się zapisać wykonania. Sprawdź, czy przeglądarka zezwala na lokalny zapis.";
      }
    });
    updateDone();
    container.appendChild(el);
  });
}

async function loadPlan() {
  if (loading) return;
  loading = true;
  refreshBtn.disabled = true;
  container.setAttribute("aria-busy", "true");
  planStatus.textContent = "Wczytywanie planu…";
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);
  try {
    const response = await fetch("./plan.json", {cache: "no-store", signal: controller.signal});
    if (!response.ok) throw new Error("Nie udało się pobrać planu");
    const updated = validatePlan(await response.json());
    plan = updated;
    renderPlan();
    planStatus.textContent = response.headers.get("X-Plan-Source") === "cache"
      ? "Plan z ostatniej zapisanej kopii. Odśwież po odzyskaniu połączenia."
      : "Plan aktualny.";
  } catch {
    planStatus.textContent = plan
      ? "Nie udało się odświeżyć planu. Wyświetlam poprzednio wczytany plan. Spróbuj ponownie."
      : "Nie udało się wczytać planu. Połącz się z siecią i wybierz „Odśwież plan”.";
  } finally {
    clearTimeout(timeout);
    loading = false;
    refreshBtn.disabled = false;
    container.setAttribute("aria-busy", "false");
  }
}

refreshBtn.addEventListener("click", loadPlan);
window.addEventListener("online", loadPlan);
window.addEventListener("storage", event => {
  if (event.key !== DONE_KEY && event.key !== null) return;
  try {
    const saved = JSON.parse(localStorage.getItem(DONE_KEY) || "{}");
    if (saved && typeof saved === "object" && !Array.isArray(saved)) {
      stored = saved;
      if (plan) renderPlan();
    }
  } catch { /* Zachowaj oznaczenia w pamięci przy błędzie odczytu. */ }
});
loadPlan();

let deferredPrompt;
const installBtn = document.getElementById("installBtn");
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = "block";
});
installBtn.addEventListener("click", async () => {
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.style.display = "none";
});

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js", {updateViaCache: "none"}).catch(() => {
    planStatus.textContent += " Tryb offline jest chwilowo niedostępny.";
  });
  navigator.serviceWorker.addEventListener("controllerchange", loadPlan);
}
</script>
</body>
</html>
